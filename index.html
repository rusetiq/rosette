<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rosette - A beautiful daily planner with cherry blossom aesthetics">
    <title>Rosette</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="petal-layer" id="petals-container"></div>

    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="brand">
                <svg class="brand-cherry" viewBox="0 0 56 56" fill="none">
                    <circle cx="18" cy="34" r="12" fill="url(#brandCherry1)" />
                    <circle cx="38" cy="34" r="12" fill="url(#brandCherry2)" />
                    <ellipse cx="15" cy="29" rx="4" ry="2.5" fill="rgba(255,255,255,0.35)" />
                    <ellipse cx="35" cy="29" rx="4" ry="2.5" fill="rgba(255,255,255,0.35)" />
                    <path d="M18 22 Q24 8 28 4 Q32 8 38 22" stroke="#5d9b5d" stroke-width="2.5" fill="none"
                        stroke-linecap="round" />
                    <path d="M28 4 Q28 -2 34 -4" stroke="#5d9b5d" stroke-width="2" fill="none" stroke-linecap="round" />
                    <path d="M32 0 Q38 3 42 0" stroke="#6db06d" stroke-width="4" stroke-linecap="round" fill="none" />
                    <defs>
                        <radialGradient id="brandCherry1" cx="0.35" cy="0.35">
                            <stop offset="0%" stop-color="#ff7b94" />
                            <stop offset="100%" stop-color="#c41e3a" />
                        </radialGradient>
                        <radialGradient id="brandCherry2" cx="0.35" cy="0.35">
                            <stop offset="0%" stop-color="#ff7b94" />
                            <stop offset="100%" stop-color="#c41e3a" />
                        </radialGradient>
                    </defs>
                </svg>
                <div class="brand-text">
                    <h1>Rosette</h1>
                    <span>Planner</span>
                </div>
            </div>

            <nav class="nav-menu">
                <button class="nav-item active" data-view="planner">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" />
                        <line x1="3" y1="10" x2="21" y2="10" />
                        <line x1="9" y1="4" x2="9" y2="10" />
                        <line x1="15" y1="4" x2="15" y2="10" />
                    </svg>
                    <span>Planner</span>
                </button>
                <a href="https://rusetiq.github.io/kitab" target="_blank" rel="noopener noreferrer" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                        <polyline points="14,2 14,8 20,8" />
                        <line x1="8" y1="13" x2="16" y2="13" />
                        <line x1="8" y1="17" x2="16" y2="17" />
                    </svg>
                    <span>Notes</span>
                </a>
            </nav>

            <div class="sidebar-stats">
                <div class="stat-ring">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="42" stroke="rgba(255,182,193,0.3)" stroke-width="8" fill="none" />
                        <circle id="progress-ring" cx="50" cy="50" r="42" stroke="url(#progressGrad)" stroke-width="8"
                            fill="none" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="264"
                            transform="rotate(-90 50 50)" />
                        <defs>
                            <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#ff69b4" />
                                <stop offset="100%" stop-color="#c41e3a" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <div class="stat-ring-content">
                        <span class="stat-percent" id="progress-percent">0%</span>
                        <span class="stat-label">Done</span>
                    </div>
                </div>
                <div class="stat-counts">
                    <div class="stat-item">
                        <span class="stat-num" id="completed-count">0</span>
                        <span class="stat-txt">Complete</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <span class="stat-num" id="remaining-count">0</span>
                        <span class="stat-txt">Remaining</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-date">
                <span class="date-day" id="day-name"></span>
                <span class="date-full" id="full-date"></span>
            </div>
        </aside>

        <main class="main-area">
            <div class="bento-grid">
                <section class="card card-tasks">
                    <header class="card-header">
                        <div class="card-title">
                            <svg class="title-icon" viewBox="0 0 40 26" fill="none">
                                <path d="M2 13 Q10 3 18 13 Q10 23 2 13Z" fill="url(#bowL)" />
                                <path d="M38 13 Q30 3 22 13 Q30 23 38 13Z" fill="url(#bowR)" />
                                <circle cx="20" cy="13" r="5" fill="#c41e3a" />
                                <ellipse cx="20" cy="13" rx="2" ry="1.5" fill="rgba(255,255,255,0.35)" />
                                <path d="M18 18 Q16 24 15 28" stroke="#c41e3a" stroke-width="2.5" fill="none"
                                    stroke-linecap="round" />
                                <path d="M22 18 Q24 24 25 28" stroke="#c41e3a" stroke-width="2.5" fill="none"
                                    stroke-linecap="round" />
                                <defs>
                                    <linearGradient id="bowL" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#ffc0cb" />
                                        <stop offset="100%" stop-color="#ff69b4" />
                                    </linearGradient>
                                    <linearGradient id="bowR" x1="100%" y1="0%" x2="0%" y2="100%">
                                        <stop offset="0%" stop-color="#ffc0cb" />
                                        <stop offset="100%" stop-color="#ff69b4" />
                                    </linearGradient>
                                </defs>
                            </svg>
                            <h2>Today's Tasks</h2>
                        </div>
                        <button class="icon-btn" id="add-task-btn" aria-label="Add task">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <line x1="12" y1="5" x2="12" y2="19" />
                                <line x1="5" y1="12" x2="19" y2="12" />
                            </svg>
                        </button>
                    </header>

                    <form class="input-form hidden" id="task-form">
                        <div class="form-row">
                            <input type="text" id="task-input" placeholder="What's on your list?" autocomplete="off">
                        </div>
                        <div class="form-row form-row-split">
                            <select id="task-priority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                            <div class="form-btns">
                                <button type="button" class="btn-ghost" id="cancel-task">Cancel</button>
                                <button type="submit" class="btn-primary">Add</button>
                            </div>
                        </div>
                    </form>

                    <ul class="task-list" id="task-list"></ul>

                    <div class="empty-placeholder" id="empty-tasks">
                        <svg viewBox="0 0 80 80" fill="none">
                            <circle cx="28" cy="48" r="14" fill="url(#emptyC1)" opacity="0.4" />
                            <circle cx="52" cy="48" r="14" fill="url(#emptyC2)" opacity="0.4" />
                            <path d="M28 34 Q36 16 40 10 Q44 16 52 34" stroke="#7cb87c" stroke-width="2" fill="none"
                                opacity="0.4" />
                            <defs>
                                <radialGradient id="emptyC1" cx="0.3" cy="0.3">
                                    <stop offset="0%" stop-color="#ffc0cb" />
                                    <stop offset="100%" stop-color="#ff69b4" />
                                </radialGradient>
                                <radialGradient id="emptyC2" cx="0.3" cy="0.3">
                                    <stop offset="0%" stop-color="#ffc0cb" />
                                    <stop offset="100%" stop-color="#ff69b4" />
                                </radialGradient>
                            </defs>
                        </svg>
                        <p>No tasks yet</p>
                        <span>Add your first cherry</span>
                    </div>
                </section>

                <section class="card card-schedule">
                    <header class="card-header">
                        <div class="card-title">
                            <svg class="title-icon" viewBox="0 0 32 32" fill="none">
                                <circle cx="16" cy="16" r="13" stroke="#c41e3a" stroke-width="2" fill="#fff8f9" />
                                <circle cx="16" cy="16" r="2.5" fill="#c41e3a" />
                                <line x1="16" y1="16" x2="16" y2="7" stroke="#c41e3a" stroke-width="2.5"
                                    stroke-linecap="round" />
                                <line x1="16" y1="16" x2="23" y2="16" stroke="#ff69b4" stroke-width="2"
                                    stroke-linecap="round" />
                                <circle cx="16" cy="4" r="1.5" fill="#ffc0cb" />
                                <circle cx="28" cy="16" r="1.5" fill="#ffc0cb" />
                                <circle cx="16" cy="28" r="1.5" fill="#ffc0cb" />
                                <circle cx="4" cy="16" r="1.5" fill="#ffc0cb" />
                            </svg>
                            <h2>Schedule</h2>
                        </div>
                        <button class="icon-btn" id="add-event-btn" aria-label="Add event">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <line x1="12" y1="5" x2="12" y2="19" />
                                <line x1="5" y1="12" x2="19" y2="12" />
                            </svg>
                        </button>
                    </header>

                    <form class="input-form hidden" id="event-form">
                        <div class="form-row form-row-split">
                            <input type="text" id="event-input" placeholder="Event name" autocomplete="off">
                            <input type="time" id="event-time">
                        </div>
                        <div class="form-row form-row-actions">
                            <button type="button" class="btn-ghost" id="cancel-event">Cancel</button>
                            <button type="submit" class="btn-primary">Add</button>
                        </div>
                    </form>

                    <div class="timeline-wrap" id="timeline"></div>

                    <div class="empty-placeholder" id="empty-events">
                        <svg viewBox="0 0 64 40" fill="none">
                            <path d="M4 20 Q14 6 26 20 Q14 34 4 20Z" fill="url(#emptyB1)" opacity="0.4" />
                            <path d="M60 20 Q50 6 38 20 Q50 34 60 20Z" fill="url(#emptyB2)" opacity="0.4" />
                            <circle cx="32" cy="20" r="8" fill="#ffc0cb" opacity="0.4" />
                            <defs>
                                <linearGradient id="emptyB1" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#ffe4ec" />
                                    <stop offset="100%" stop-color="#ffb6c1" />
                                </linearGradient>
                                <linearGradient id="emptyB2" x1="100%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="#ffe4ec" />
                                    <stop offset="100%" stop-color="#ffb6c1" />
                                </linearGradient>
                            </defs>
                        </svg>
                        <p>No events</p>
                        <span>Plan your day</span>
                    </div>
                </section>

                <section class="card card-notes">
                    <header class="card-header">
                        <div class="card-title">
                            <svg class="title-icon" viewBox="0 0 32 32" fill="none">
                                <path d="M16 2 Q26 10 26 16 Q26 26 16 30 Q6 26 6 16 Q6 10 16 2Z"
                                    fill="url(#petalGrad)" />
                                <path d="M16 6 Q22 12 22 16 Q22 24 16 26" stroke="rgba(255,255,255,0.45)"
                                    stroke-width="1.5" fill="none" />
                                <defs>
                                    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#ffe4ec" />
                                        <stop offset="100%" stop-color="#ffb6c1" />
                                    </linearGradient>
                                </defs>
                            </svg>
                            <h2>Quick Notes</h2>
                        </div>
                    </header>
                    <textarea class="notes-editor" id="notes-area"
                        placeholder="Jot down thoughts, ideas, or reminders..."></textarea>
                </section>

                <section class="card card-quote">
                    <div class="quote-content">
                        <svg class="quote-mark" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z" />
                        </svg>
                        <p id="quote-text">Every accomplishment starts with the decision to try.</p>
                        <span id="quote-author">John F. Kennedy</span>
                    </div>
                    <button class="refresh-quote" id="new-quote" aria-label="New quote">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                            <path d="M21 3v5h-5" />
                        </svg>
                    </button>
                </section>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
